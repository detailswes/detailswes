      <stop offset="100%" stop-color="#00f082"/>
    </linearGradient>
    <radialGradient id="glowA" cx="20%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#00f082" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#00f082" stop-opacity="0"/>
