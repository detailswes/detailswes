      .f-outfit { font-family: 'Outfit', 'Segoe UI', Arial, sans-serif; }
      .f-mono   { font-family: 'Space Mono', 'Courier New', monospace; }
    </style>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00f082"/>
      <stop offset="100%" stop-color="#0af"/>
    </linearGradient>
    <linearGradient id="waveTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00f082" stop-opacity="0.7"/>
      <stop offset="50%"  stop-color="#0a84ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00f082" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="waveBtm" x1="0%" y1="0%" x2="100%" y2="0%">
