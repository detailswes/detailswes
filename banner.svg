    <radialGradient id="glowB" cx="85%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#0a84ff" stop-opacity="0"/>
